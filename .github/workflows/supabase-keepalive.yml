name: Supabase Keep-Alive

# Pings the Supabase REST API every 3 days so the free-tier project never
# hits the 7-day inactivity threshold that causes it to auto-pause.
# The key used here is the PUBLISHABLE (anon) key — the same one already
# embedded in index.html and visible to any site visitor, so putting it in
# this workflow file adds no new exposure.

on:
  schedule:
    - cron: '0 3 */3 * *'   # every 3 days at 03:00 UTC (11:00 AM Manila time)
  workflow_dispatch:        # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://btktxpwogocltkshepjy.supabase.co/rest/v1/arcs?select=*&limit=1" -H "apikey: PASTE_KEY_HERE"); echo "Supabase responded with HTTP $STATUS"; [ "$STATUS" = "200" ] || { echo "::warning::Keep-alive ping got HTTP $STATUS - check if project needs unpausing."; exit 1; }
