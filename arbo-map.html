<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pangasinan ARBO Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f0;color:#173c28;font:14px Arial,sans-serif}header{padding:20px 24px;border-bottom:2px solid #165735}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5;margin:8px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}input,select,button{font:inherit;padding:9px;border:1px solid #bacabc;border-radius:4px;background:white;color:#173c28}input{flex:1;min-width:180px}button{cursor:pointer}.layout{display:grid;grid-template-columns:340px 1fr;height:650px;height:calc(100vh - 215px);min-height:440px}#directory{overflow:auto;padding:12px}#map{min-height:440px}.record{display:block;text-align:left;width:100%;margin-bottom:8px;padding:12px;line-height:1.45}.record strong{display:block}.record small{display:block;color:#586658}.record:focus,.record:hover{border-color:#0e4d2b;background:#eef5ec}.badge{display:inline-block;margin-top:6px;color:#8b5100;font-size:12px}.key{font-size:12px;color:#52634f}.count{background:#0e4d2b;color:white;border:2px solid white;border-radius:50%;display:grid;place-items:center;width:30px;height:30px;font-weight:bold;box-shadow:0 1px 5px #777}.leaflet-popup-content{max-height:250px;overflow:auto}.leaflet-popup-content p{margin:7px 0}#stats{font-weight:bold} @media(max-width:750px){.layout{display:flex;flex-direction:column-reverse;height:auto}#map{height:460px}#directory{max-height:500px}h1{font-size:19px}}
</style></head><body>
<header><h1>Agrarian Reform Beneficiaries Organizations</h1><p>Pangasinan ARBO masterlist · July 2026</p><div id="stats" role="status">Loading masterlist…</div><p class="key">Numbered markers group organizations at the same approximate barangay location. These are not verified ARBO office coordinates. Select a marker or organization to explore.</p><div class="controls"><input id="search" aria-label="Search organizations" placeholder="Search ARBO, barangay, ARC or cluster"><select id="municipality" aria-label="Municipality"><option value="">All municipalities</option></select><select id="status" aria-label="Organization status"><option value="">All statuses</option></select><button id="fit">Fit map</button></div></header>
<main class="layout"><aside id="directory" aria-label="ARBO directory"></aside><div id="map" aria-label="Pangasinan ARBO map"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="arbo-map.js"></script></body></html>
