<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC Cluster Atlas — DAR Pangasinan IMIS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E4D2B;
    --ink-deep:#0A3A20;
    --paper:#F5F0D8;
    --paper-2:#FBF9EE;
    --paper-3:#FDFCF4;
    --line:#DCE6D6;
    --gold:#D4A017;
    --muted:#7C8A78;
    --card-shadow: 0 1px 0 rgba(14,77,43,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);font-family:'IBM Plex Sans',sans-serif;color:#1F2A1A;}
  #root{display:flex;flex-direction:column;height:100vh;min-height:640px;}

  /* ---------- Header ---------- */
  .hdr{
    display:flex;align-items:center;gap:14px;
    padding:14px 22px;
    background:var(--ink);
    color:var(--paper-2);
    border-bottom:3px solid var(--gold);
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .hdr::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, rgba(212,160,23,0.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .seal{flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));}
  .hdr-text{position:relative;z-index:1;}
  .hdr-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;opacity:.75;text-transform:uppercase;}
  .hdr-title{font-family:'Roboto Slab',serif;font-weight:700;font-size:19px;line-height:1.15;margin-top:2px;}
  .hdr-sub{font-size:11.5px;opacity:.8;margin-top:3px;}
  .hdr-right{margin-left:auto;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.8;position:relative;z-index:1;}
  .hdr-right b{display:block;font-size:15px;color:var(--gold);font-family:'Roboto Slab',serif;font-weight:700;}

  /* ---------- Body layout ---------- */
  .body{display:flex;flex:1;min-height:0;}
  .sidebar{
    width:328px;flex-shrink:0;
    background:var(--paper-3);
    border-right:1.5px solid var(--ink);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .search-wrap{padding:14px 14px 10px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .search-box{position:relative;}
  .search-box input{
    width:100%;padding:9px 10px 9px 32px;border:1px solid #BFD0BC;background:var(--paper-2);
    border-radius:3px;font-size:12.5px;font-family:'IBM Plex Sans',sans-serif;color:#1F2A1A;
  }
  .search-box input:focus{outline:2px solid var(--gold);outline-offset:0;}
  .search-box i{position:absolute;left:10px;top:11px;color:var(--muted);font-size:12px;}
  .reset-btn{
    margin-top:8px;width:100%;padding:7px 8px;background:none;border:1px solid var(--ink);color:var(--ink);
    font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:3px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;transition:background .15s,color .15s;
  }
  .reset-btn:hover{background:var(--ink);color:var(--paper-2);}

  .cluster-list{flex:1;overflow-y:auto;padding:10px 12px 20px;}
  .cluster-card{
    border:1.5px solid var(--line);
    background:var(--paper-2);
    border-radius:4px;
    margin-bottom:10px;
    cursor:pointer;
    overflow:hidden;
    opacity:0;
    transform:translateY(8px);
    animation:cardIn .45s cubic-bezier(.2,.7,.3,1) forwards;
    transition:border-color .18s, box-shadow .18s, transform .18s;
  }
  .cluster-card:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(14,77,43,0.12);}
  .cluster-card.active{border-color:var(--c,var(--ink));box-shadow:0 4px 14px rgba(14,77,43,0.18);}
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}

  .cc-head{display:flex;align-items:center;gap:10px;padding:11px 12px;}
  .cc-swatch{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,0.6) inset;}
  .cc-title{flex:1;min-width:0;}
  .cc-abbr{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);}
  .cc-name{font-family:'Roboto Slab',serif;font-weight:600;font-size:13px;line-height:1.25;margin-top:1px;color:var(--ink-deep);}
  .cc-chev{font-size:11px;color:var(--muted);transition:transform .25s;flex-shrink:0;}
  .cluster-card.active .cc-chev{transform:rotate(90deg);color:var(--c,var(--ink));}
  .cc-meta{display:flex;gap:10px;padding:0 12px 11px 33px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
  .cc-meta span{display:flex;align-items:center;gap:4px;}

  .cc-body{
    max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.2,.7,.3,1);
    background:var(--paper-3);border-top:1px dashed var(--line);
  }
  .cluster-card.active .cc-body{max-height:600px;}
  .cc-section{padding:10px 12px;}
  .cc-label{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .chip-row{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{
    font-size:11px;padding:3px 8px;border-radius:11px;background:var(--paper);border:1px solid var(--line);
    color:var(--ink-deep);cursor:pointer;transition:background .15s,transform .1s;
  }
  .chip:hover{transform:translateY(-1px);}
  .arc-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .arc-row:last-child{border-bottom:none;}
  .arc-row:hover .arc-name{color:var(--c,var(--ink));}
  .arc-name{font-weight:600;color:#1F2A1A;transition:color .15s;}
  .arc-muni{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);}

  .empty-note{padding:26px 16px;text-align:center;color:var(--muted);font-size:12px;}

  /* ---------- Map area ---------- */
  .map-area{flex:1;position:relative;min-width:0;}
  #map{width:100%;height:100%;background:#EFEADA;}
  .map-title-overlay{
    position:absolute;top:14px;left:14px;z-index:600;
    background:rgba(253,252,244,0.92);border:1.5px solid var(--ink);border-radius:3px;
    padding:8px 14px;pointer-events:none;
  }
  .map-title-overlay .big{font-family:'Roboto Slab',serif;font-weight:700;font-size:15px;color:var(--ink-deep);}
  .map-title-overlay .small{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:.04em;margin-top:1px;}

  .legend{
    position:absolute;bottom:14px;left:14px;z-index:600;
    background:rgba(253,252,244,0.95);border:1.5px solid var(--ink);border-radius:3px;
    padding:10px 14px;max-width:280px;
  }
  .legend-title{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:7px;text-transform:uppercase;}
  .legend-row{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:5px;cursor:pointer;}
  .legend-row:last-child{margin-bottom:0;}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  .banner{
    position:absolute;top:14px;right:14px;z-index:600;
    background:rgba(253,252,244,0.95);border:1.5px solid var(--gold);border-radius:3px;
    padding:9px 14px;max-width:300px;
    opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .3s,transform .3s;
  }
  .banner.show{opacity:1;transform:translateY(0);}
  .banner .b-abbr{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:.06em;}
  .banner .b-name{font-family:'Roboto Slab',serif;font-weight:700;font-size:13px;color:var(--ink-deep);line-height:1.2;margin-top:2px;}

  .muni-label{background:transparent!important;border:none!important;box-shadow:none!important;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:#5A6656;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper);}
  .muni-label.on{color:var(--ink-deep);font-weight:700;font-size:10.5px;}
  .leaflet-popup-content-wrapper{border-radius:4px;border:1.5px solid var(--ink);}
  .leaflet-popup-tip{background:var(--paper-2);}
  .pop-cluster{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .pop-arc{font-family:'Roboto Slab',serif;font-weight:700;font-size:13.5px;color:var(--ink-deep);margin:2px 0 4px;}
  .pop-muni{font-size:11.5px;color:#3A463A;}

  @keyframes pulseRing{
    0%{stroke-opacity:.9;r:9;}
    70%{stroke-opacity:0;r:20;}
    100%{stroke-opacity:0;r:20;}
  }
  .footer-strip{
    flex-shrink:0;padding:6px 22px;background:var(--ink);color:rgba(245,240,216,0.65);
    font-family:'IBM Plex Mono',monospace;font-size:10px;display:flex;justify-content:space-between;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#C9C4A8;border-radius:4px;}
</style>
</head>

<div id="root">

  <div class="hdr">
    <svg class="seal" width="36" height="36" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="16" fill="#0A3A20" stroke="#D4A017" stroke-width="2"/>
      <path d="M17 8 L17 25 M17 12 L13 9 M17 12 L21 9 M17 16.5 L13 13.5 M17 16.5 L21 13.5 M17 21 L13 18 M17 21 L21 18"

  <div class="body">
    <div class="sidebar">
      <div class="search-wrap">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" placeholder="Search cluster, ARC, or municipality…"/>
        </div>
        <button class="reset-btn" id="resetBtn"><i class="fa-solid fa-arrows-rotate" style="margin-right:5px;"></i>Show entire province</button>
      </div>
      <div class="cluster-list" id="clusterList"></div>
    </div>

    <div class="map-area">
      <div id="map"></div>
      <div class="map-title-overlay">
        <div class="big">Pangasinan</div>
        <div class="small">ARC Clusters · Municipalities · ARCs</div>
      </div>
      <div class="banner" id="banner">
        <div class="b-abbr" id="bAbbr"></div>
        <div class="b-name" id="bName"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="footer-strip">
    <span>DAR IMIS · ARC Cluster Module</span>
    <span id="footStamp"></span>
  </div>
</div>

const PALETTE = [
  { key:'EPARCC',   color:'#1B5E20' },
  { key:'LARBARCC', color:'#0D47A1' },
  { key:'KALAHI',   color:'#B3541E' },
  { key:'WEPARCC1', color:'#6A3E8C' },
  { key:'WEPARCC2', color:'#C98A12' },
];
function abbrFor(name){
  const m = name.match(/\(([^)]+)\)/);
  if(m) return m[1];
  if(name.toUpperCase() === name) return name;
  return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,8);
}
CLUSTERS.forEach((c,i)=>{
  c.abbr = abbrFor(c.name);
  c.color = PALETTE[i % PALETTE.length].color;
});

document.getElementById('cCount').textContent = CLUSTERS.length;
document.getElementById('footStamp').textContent = 'Rendered ' + new Date().toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'});

/* ============ MAP INIT ============ */
const map = L.map('map', { attributionControl:false, zoomSnap:.25 }).setView([15.95,120.35], 9.4);
const baseLayer = L.layerGroup().addTo(map);
const clusterLayer = L.layerGroup().addTo(map);
const arcLayer = L.layerGroup().addTo(map);
const pulseLayer = L.layerGroup().addTo(map);

/* Which municipalities belong to which cluster (by Lm-style key) */
const muniClusterMap = {}; // lmKey -> [{cluster, color}]
CLUSTERS.forEach(c=>{
  c.municipalities.forEach(m=>{
    const key = NAME_MAP[m] || m;
    if(!muniClusterMap[key]) muniClusterMap[key] = [];
    muniClusterMap[key].push(c);
  });
});

/* Base province: every municipality, faint outline, cluster ones tinted */
const muniLayerByKey = {};
Object.entries(MUNI_POLYS).forEach(([key, rings])=>{
  if(!rings || !rings.length) return;
  const involved = muniClusterMap[key];
  const layers = [];
  rings.forEach(ring=>{
    const latlngs = ring.map(p=>[p[0],p[1]]);
    const poly = L.polygon(latlngs, {
      color: involved ? involved[0].color : '#0E4D2B',
      weight: involved ? 1.6 : .9,
      opacity: involved ? .75 : .35,
      fillColor: involved ? involved[0].color : '#EFEADA',
      fillOpacity: involved ? .22 : .5,
    }).addTo(baseLayer);
    layers.push(poly);
  });
  muniLayerByKey[key] = layers;
  // label
  const biggest = rings.reduce((a,b)=> a.length>=b.length? a:b);
  const c = biggest.reduce((acc,p)=>[acc[0]+p[0],acc[1]+p[1]], [0,0]).map(v=>v/biggest.length);
  L.marker(c, {
    icon: L.divIcon({className:'muni-label'+(involved?' on':''), html: key, iconSize:[0,0]}),
    interactive:false
  }).addTo(baseLayer);
});

/* ============ ARC POINT PLACEMENT ============ */
function ringCentroid(rings){
  const biggest = rings.reduce((a,b)=> a.length>=b.length? a:b);
  const sum = biggest.reduce((acc,p)=>[acc[0]+p[0],acc[1]+p[1]], [0,0]);
  return [sum[0]/biggest.length, sum[1]/biggest.length];
}

CLUSTERS.forEach(c=>{
  const byMuni = {};
  c.arcs.forEach(a=>{ (byMuni[a.municipality] = byMuni[a.municipality]||[]).push(a); });
  Object.entries(byMuni).forEach(([muni, arcs])=>{
    const key = NAME_MAP[muni] || muni;
    const rings = MUNI_POLYS[key];
    if(!rings) return;
    const center = ringCentroid(rings);
    const n = arcs.length;
    arcs.forEach((a,i)=>{
      const angle = (2*Math.PI*i/Math.max(n,1)) + (n>1?0:0);
      const radius = n>1 ? 0.014 : 0;
      const lat = center[0] + radius*Math.sin(angle);
      const lon = center[1] + radius*Math.cos(angle);
      a._latlng = [lat, lon];
      a._cluster = c;
    });
  });
});

function drawArcMarkers(){
  arcLayer.clearLayers();
  CLUSTERS.forEach(c=>{
    c.arcs.forEach(a=>{
      if(!a._latlng) return;
      const m = L.circleMarker(a._latlng, {
        radius: 6.5, weight: 1.6, color:'#1F2A1A', fillColor: c.color, fillOpacity: .95,
        className: 'arc-marker'
      });
      m.bindPopup(
        '<div class="pop-cluster">'+c.abbr+'</div>'+
        '<div class="pop-arc">Brgy. '+a.arc+'</div>'+
        '<div class="pop-muni">'+a.municipality+', Pangasinan</div>'
      );
      m._clusterName = c.name;
      m.addTo(arcLayer);
    });
  });
}
drawArcMarkers();

const legendEl = document.getElementById('legend');
function renderLegend(){
  legendEl.innerHTML = '<div class="legend-title">ARC Clusters</div>' +

      '<div class="legend-row" data-name="'+encodeURIComponent(c.name)+'">'+
      '<span class="legend-dot" style="background:'+c.color+'"></span>'+
      '<span>'+c.abbr+'</span></div>'
    )).join('');
  legendEl.querySelectorAll('.legend-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const name = decodeURIComponent(row.getAttribute('data-name'));
      selectCluster(name, true);
    });
  });
}
renderLegend();

  CLUSTERS.forEach((c, idx)=>{
    const matchesCluster = c.name.toLowerCase().includes(ft) || c.abbr.toLowerCase().includes(ft);
    const matchingArcs = c.arcs.filter(a=> a.arc.toLowerCase().includes(ft) || a.municipality.toLowerCase().includes(ft));
    if(ft && !matchesCluster && matchingArcs.length===0) return;
    shown++;
    const card = document.createElement('div');
    card.className = 'cluster-card' + (activeCluster===c.name ? ' active':'');
    card.style.setProperty('--c', c.color);
    card.style.animationDelay = (idx*0.05)+'s';
    card.innerHTML =
      '<div class="cc-head">'+
        '<span class="cc-swatch" style="background:'+c.color+'"></span>'+
        '<div class="cc-title"><div class="cc-abbr">'+c.abbr+'</div><div class="cc-name">'+c.name.replace(/\s*\([^)]*\)\s*$/,'')+'</div></div>'+
        '<i class="fa-solid fa-chevron-right cc-chev"></i>'+
      '</div>'+
      '<div class="cc-meta">'+
        '<span><i class="fa-solid fa-map-location-dot"></i>'+c.municipalities.length+' municipalities</span>'+
        '<span><i class="fa-solid fa-people-roof"></i>'+c.arcs.length+' ARCs</span>'+
      '</div>'+
      '<div class="cc-body">'+
        '<div class="cc-section">'+
          '<div class="cc-label">Municipalities involved</div>'+
          '<div class="chip-row">'+c.municipalities.map(m=>'<span class="chip">'+m+'</span>').join('')+'</div>'+
        '</div>'+
        '<div class="cc-section" style="border-top:1px solid var(--line);">'+
          '<div class="cc-label">Agrarian Reform Communities</div>'+
          c.arcs.map(a=>'<div class="arc-row" data-arc="'+encodeURIComponent(a.arc)+'" data-muni="'+encodeURIComponent(a.municipality)+'">'+
            '<span class="arc-name">Brgy. '+a.arc+'</span><span class="arc-muni">'+a.municipality+'</span></div>').join('')+
        '</div>'+
      '</div>';
    card.querySelector('.cc-head').addEventListener('click', ()=> selectCluster(c.name));
    card.querySelector('.cc-meta').addEventListener('click', ()=> selectCluster(c.name));
    card.querySelectorAll('.arc-row').forEach(row=>{
      row.addEventListener('click', (e)=>{
        e.stopPropagation();
        const arcName = decodeURIComponent(row.getAttribute('data-arc'));
        const muniName = decodeURIComponent(row.getAttribute('data-muni'));
        selectCluster(c.name, false, arcName, muniName);
      });
    });
    listEl.appendChild(card);
  });
  if(shown===0){
    listEl.innerHTML = '<div class="empty-note"><i class="fa-solid fa-magnifying-glass" style="font-size:20px;display:block;margin-bottom:8px;opacity:.5;"></i>No clusters or ARCs match your search.</div>';
  }
}
renderCards();

/* ============ SELECTION / HIGHLIGHT LOGIC ============ */
const bannerEl = document.getElementById('banner');
function showBanner(c){
  document.getElementById('bAbbr').textContent = c.abbr;
  document.getElementById('bName').textContent = c.name;
  bannerEl.classList.add('show');
}
function hideBanner(){ bannerEl.classList.remove('show'); }

function pulseAt(latlng, color){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  // Leaflet handles this via a circleMarker with CSS animation instead
  const ring = L.circleMarker(latlng, {radius:9, color:color, weight:2, fill:false, opacity:.9});
  ring.addTo(pulseLayer);
  const el = ring.getElement ? ring.getElement() : null;
  let path = ring._path;
  if(path){ path.style.animation = 'pulseRing 1.1s ease-out'; path.style.transformOrigin = 'center'; path.style.transformBox = 'fill-box'; }
  setTimeout(()=>{ pulseLayer.removeLayer(ring); }, 1150);
}

function resetHighlight(){
  activeCluster = null;
  Object.entries(muniLayerByKey).forEach(([key, layers])=>{
    const involved = muniClusterMap[key];
    layers.forEach(poly=>{
      poly.setStyle({
        opacity: involved? .75 : .35,
        fillOpacity: involved? .22 : .5,
        weight: involved? 1.6 : .9
      });
    });
  });
  arcLayer.eachLayer(m=>{
    m.setStyle({ radius:6.5, fillOpacity:.95, weight:1.6 });
  });
  hideBanner();
  map.flyTo([15.95,120.35], 9.4, {duration:.9});
}

function selectCluster(name, fromLegend, focusArc, focusMuni){
  const c = CLUSTERS.find(x=>x.name===name);
  if(!c) return;
  activeCluster = name;
  renderCards(document.getElementById('searchInput').value);

  const bounds = [];
  Object.entries(muniLayerByKey).forEach(([key, layers])=>{
    const isMember = c.municipalities.some(m => (NAME_MAP[m]||m) === key);
    layers.forEach(poly=>{
      poly.setStyle({
        opacity: isMember? 1 : .12,
        fillOpacity: isMember? .38 : .07,
        weight: isMember? 2.4 : .6,
        color: isMember? c.color : '#0E4D2B'
      });
      if(isMember) bounds.push(poly.getBounds());
    });
  });

  arcLayer.eachLayer(m=>{
    const isMember = m._clusterName === name;
    m.setStyle({ radius: isMember? 8.5:5, fillOpacity: isMember? 1:.15, weight: isMember? 2:.8 });
  });

  showBanner(c);

  if(focusArc){
    const arcObj = c.arcs.find(a=>a.arc===focusArc && a.municipality===focusMuni);
    if(arcObj && arcObj._latlng){
      map.flyTo(arcObj._latlng, 13.5, {duration:.9});
      setTimeout(()=> pulseAt(arcObj._latlng, c.color), 500);
      return;
    }
  }
  if(bounds.length){
    let all = bounds[0];
    bounds.forEach(b=> all = all.extend(b));
    map.flyToBounds(all, {padding:[60,60], duration:.9, maxZoom:11.5});
  }
}

/* ============ SEARCH & RESET ============ */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  renderCards(e.target.value);
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.getElementById('searchInput').value='';
  renderCards();
  resetHighlight();
});

setTimeout(()=> map.invalidateSize(), 150);
</script>
