<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infrastructure Monitoring & Information System — DAR Pangasinan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<style>
  :root { --ease: cubic-bezier(.4,0,.2,1); --ease-out: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: radial-gradient(1200px 600px at 8% -10%, #F1EEDC 0%, #F8F7ED 55%), linear-gradient(160deg, #F8F7ED 0%, #F5F3E6 50%, #F8F7ED 100%);
    background-attachment: fixed;
    color: #0E4D2B;
    animation: imisBodyIn .5s var(--ease-out) both;
  }
  @keyframes imisBodyIn { from { opacity: 0; } to { opacity: 1; } }

  input, select, textarea { transition: outline-color .18s var(--ease), box-shadow .18s var(--ease); }
  input:focus, select:focus, textarea:focus { outline: 2px solid #D4A017; outline-offset: 0; box-shadow: 0 0 0 4px rgba(212,160,23,0.16); }

  button { font-family: inherit; transition: opacity .15s var(--ease), transform .12s var(--ease), box-shadow .15s var(--ease); }
  button:hover { opacity: 0.85; transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(0.96); }
  button:disabled { opacity: 0.4 !important; cursor: default !important; transform: none !important; }

  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: #4A5A46; padding: 6px 10px; border-bottom: 1.5px solid #0E4D2B; }
  td { padding: 10px; border-bottom: 1px solid #DCE6D6; font-size: 13px; vertical-align: top; }
  tbody tr { transition: background .15s var(--ease); animation: imisRowIn .32s var(--ease-out) both; }
  tbody tr:hover { background: #F2F5EC; }
  tbody tr:nth-child(1) { animation-delay: .01s; } tbody tr:nth-child(2) { animation-delay: .02s; }
  tbody tr:nth-child(3) { animation-delay: .03s; } tbody tr:nth-child(4) { animation-delay: .04s; }
  tbody tr:nth-child(5) { animation-delay: .05s; } tbody tr:nth-child(6) { animation-delay: .06s; }
  tbody tr:nth-child(7) { animation-delay: .07s; } tbody tr:nth-child(8) { animation-delay: .08s; }
  tbody tr:nth-child(9) { animation-delay: .09s; } tbody tr:nth-child(10) { animation-delay: .10s; }
  tbody tr:nth-child(n+11) { animation-delay: .11s; }
  @keyframes imisRowIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #EDE9DA; }
  ::-webkit-scrollbar-thumb { background: #C3BC9F; border-radius: 5px; transition: background .2s var(--ease); }
  ::-webkit-scrollbar-thumb:hover { background: #A79F7C; }

  .imis-shell { animation: imisFadeIn .4s var(--ease-out) both; }
  .imis-sidebar { animation: imisSlideInLeft .45s var(--ease-out) both; }
  .imis-main { animation: imisFadeUp .45s var(--ease-out) .06s both; }
  @keyframes imisFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes imisSlideInLeft { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes imisFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .imis-card {
    transition: box-shadow .22s var(--ease), transform .22s var(--ease), border-color .22s var(--ease);
    animation: imisCardIn .4s var(--ease-out) both;
    will-change: transform;
  }
  .imis-card:hover { box-shadow: 0 10px 26px rgba(14,77,43,0.16), 0 2px 8px rgba(14,77,43,0.08); transform: translateY(-3px); }
  .imis-card:active { transform: translateY(-1px); }
  @keyframes imisCardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .imis-grid-2 > .imis-card:nth-child(1), .imis-grid-3 > .imis-card:nth-child(1), .imis-grid-4 > .imis-card:nth-child(1) { animation-delay: .02s; }
  .imis-grid-2 > .imis-card:nth-child(2), .imis-grid-3 > .imis-card:nth-child(2), .imis-grid-4 > .imis-card:nth-child(2) { animation-delay: .06s; }
  .imis-grid-2 > .imis-card:nth-child(3), .imis-grid-3 > .imis-card:nth-child(3), .imis-grid-4 > .imis-card:nth-child(3) { animation-delay: .10s; }
  .imis-grid-2 > .imis-card:nth-child(4), .imis-grid-3 > .imis-card:nth-child(4), .imis-grid-4 > .imis-card:nth-child(4) { animation-delay: .14s; }
  .imis-grid-3 > .imis-card:nth-child(5), .imis-grid-4 > .imis-card:nth-child(5) { animation-delay: .18s; }
  .imis-grid-3 > .imis-card:nth-child(6), .imis-grid-4 > .imis-card:nth-child(6) { animation-delay: .22s; }
  .imis-grid-4 > .imis-card:nth-child(7) { animation-delay: .26s; }
  .imis-grid-4 > .imis-card:nth-child(8) { animation-delay: .30s; }

  .imis-navbtn {
    transition: background .16s var(--ease), padding-left .16s var(--ease), color .16s var(--ease);
    position: relative;
    overflow: hidden;
  }
  .imis-navbtn:hover { padding-left: 4px; }
  .imis-navbtn::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: #D4A017; transform: scaleY(0); transform-origin: center;
    transition: transform .18s var(--ease-out);
  }
  .imis-navbtn:hover::before { transform: scaleY(1); }

  .imis-titleblock { animation: imisFadeUp .5s var(--ease-out) both; }
  .imis-titleblock > div { transition: background .18s var(--ease); }

  .leaflet-container { background: #F8F7ED !important; font-family: 'IBM Plex Sans', sans-serif; }
  .leaflet-tooltip { background: #FBF9F1; border: 1px solid #BFD0BC; color: #0E4D2B; font-size: 10.5px; border-radius: 3px; box-shadow: none; }
  .brgy-label { font-weight: 700; font-size: 11px; background: #0E4D2B !important; color: #F5F0D8 !important; border: none !important; padding: 2px 6px; }
  .brgy-label::before { border-top-color: #0E4D2B !important; }
  .muni-label { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 10px; color: #0E4D2B; letter-spacing: 0.01em; text-shadow: -1px -1px 0 #F8F7ED, 1px -1px 0 #F8F7ED, -1px 1px 0 #F8F7ED, 1px 1px 0 #F8F7ED, 0 0 4px #F8F7ED; pointer-events: none; }
  .muni-label::before { display: none !important; }
  .map-title-overlay { position: absolute; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 400; animation: imisFadeUp .6s var(--ease-out) both; }
  .map-title-overlay .big { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 26px; letter-spacing: 0.12em; color: #0E4D2B; opacity: 0.16; text-transform: uppercase; }
  .map-title-overlay .small { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: #0E4D2B; opacity: 0.35; text-transform: uppercase; margin-top: -6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
  @media (max-width: 860px) {
    .imis-shell { flex-direction: column; }
    .imis-sidebar { width: 100% !important; border-right: none !important; border-bottom: 1.5px solid #0E4D2B; }
    .imis-grid-3 { grid-template-columns: 1fr !important; }
    .imis-grid-2 { grid-template-columns: 1fr !important; }
    .imis-grid-4 { grid-template-columns: 1fr 1fr !important; }
    .imis-main { padding: 18px 16px !important; }
    .imis-titleblock { flex-direction: column; }
    .imis-titleblock > div { border-right: none !important; border-bottom: 1px solid #0E4D2B; }
  }
  @media (max-width: 520px) {
    .imis-grid-4 { grid-template-columns: 1fr !important; }
  }
</style>
</head>

  // SheetJS's free CDN build (xlsx.full.min.js) can't write cell styling

  // also drops the CDN dependency for this export (works fully offline).
  const yn = (v) => (v ? "Yes" : "No");
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const peso = (v) => (typeof v === "number" ? "₱" + v.toLocaleString("en-PH") : esc(v));

  const BORDER = "border:1px solid #444;";
  const BASE = BORDER + "padding:5px 8px;font-family:Calibri,Arial,sans-serif;font-size:11pt;vertical-align:middle;";
  const NAVY = "#1c4e80";
  const MAROON = "#8a1f2b";
  const LIGHT = "#eef3fb";

  function td(text, opts) {
    opts = opts || {};
    const style = BASE +
      (opts.bold ? "font-weight:bold;" : "") +
      (opts.italic ? "font-style:italic;" : "") +
      "text-align:" + (opts.align || "left") + ";" +
      (opts.bg ? "background:" + opts.bg + ";" : "") +
      (opts.color ? "color:" + opts.color + ";" : "") +
      (opts.size ? "font-size:" + opts.size + ";" : "");
    const cs = opts.colspan ? ' colspan="' + opts.colspan + '"' : "";
    return '<td style="' + style + '"' + cs + '>' + esc(text) + "</td>";
  }

  // A plain label/value row: label spans the first two columns, value the last two.
  function row(label, value, opts) {
    opts = opts || {};
    return "<tr>" + td(label, { bold: true, colspan: 2 }) +
      td(value, { align: opts.align, colspan: 2 }) + "</tr>";
  }

  // A section band: bold navy title on the left, "Points" legend + max on the right.
  function sectionHeader(title, max) {
    return "<tr>" +
      td(title, { bold: true, color: NAVY, bg: LIGHT, size: "12pt", colspan: 2 }) +
      (max != null
        ? td("Points", { bold: true, color: MAROON, align: "right", bg: LIGHT }) +
          td("/ " + max, { bold: true, align: "center", bg: LIGHT })
        : td("", { bg: LIGHT, colspan: 2 })) +
      "</tr>";
  }

  function scoreRow(label, score, max) {
    return "<tr>" + td(label, { bold: true, colspan: 2 }) +
      td(score == null ? "" : score, { bold: true, align: "center", bg: "#fffbe6" }) +
      td("/ " + max, { align: "center" }) +
      "</tr>";
  }

  const rowsHtml = [
    // Title block
    '<tr>' + td("PROJECT VALIDATION FORM NO. 1", { bold: true, align: "center", size: "14pt", colspan: 3 }) +

    '<tr><td colspan="4" style="border:none;height:6px;"></td></tr>',

    scoreRow("Score", d.carpScore, 20),

    sectionHeader("ARBs and Population (supplementary — not part of the official score)", null),
    row("ARBs in this barangay (on the ARC)", d.ownArb),
    row("Population, this barangay", d.ownPop != null ? d.ownPop : "no data"),

    sectionHeader("G.  Justification / Notes", null),
    "<tr>" + td(d.justification || "", { colspan: 4 }) + "</tr>",
    '<tr><td colspan="4" style="border:none;height:10px;"></td></tr>',

    "<tr>" + td("TOTAL SCORE", { bold: true, size: "12pt", colspan: 2 }) +

    '<tr><td colspan="4" style="border:none;height:14px;"></td></tr>',
