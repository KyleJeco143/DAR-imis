<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infrastructure Monitoring & Information System — DAR Pangasinan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #F8F7ED; color: #0E4D2B; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #D4A017; outline-offset: 0; }
  button { font-family: inherit; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4 !important; cursor: default !important; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: #4A5A46; padding: 6px 10px; border-bottom: 1.5px solid #0E4D2B; }
  td { padding: 10px; border-bottom: 1px solid #DCE6D6; font-size: 13px; vertical-align: top; }
  tbody tr:hover { background: #F2F5EC; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #EDE9DA; }
  ::-webkit-scrollbar-thumb { background: #C3BC9F; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #A79F7C; }
  .imis-card { transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .imis-card:hover { box-shadow: 0 3px 10px rgba(14,77,43,0.14); transform: translateY(-1px); }
  .imis-navbtn { transition: background 0.12s ease; }
  .leaflet-container { background: #F8F7ED !important; font-family: 'IBM Plex Sans', sans-serif; }
  .leaflet-tooltip { background: #FBF9F1; border: 1px solid #BFD0BC; color: #0E4D2B; font-size: 10.5px; border-radius: 3px; box-shadow: none; }
  .brgy-label { font-weight: 700; font-size: 11px; background: #0E4D2B !important; color: #F5F0D8 !important; border: none !important; padding: 2px 6px; }
  @keyframes brgyLitPulse { 0%, 100% { fill-opacity: 0.3; filter: drop-shadow(0 0 2px #D4A017); } 50% { fill-opacity: 0.62; filter: drop-shadow(0 0 9px #D4A017); } }
  .brgy-lit { animation: brgyLitPulse 1.8s ease-in-out infinite; }
  .brgy-label::before { border-top-color: #0E4D2B !important; }
  .muni-label { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 10px; color: #0E4D2B; letter-spacing: 0.01em; text-shadow: -1px -1px 0 #F8F7ED, 1px -1px 0 #F8F7ED, -1px 1px 0 #F8F7ED, 1px 1px 0 #F8F7ED, 0 0 4px #F8F7ED; pointer-events: none; }
  .muni-label::before { display: none !important; }
  .map-title-overlay { position: absolute; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 400; }
  .map-title-overlay .big { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 26px; letter-spacing: 0.12em; color: #0E4D2B; opacity: 0.16; text-transform: uppercase; }
  .map-title-overlay .small { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: #0E4D2B; opacity: 0.35; text-transform: uppercase; margin-top: -6px; }
  @media (max-width: 860px) {
    .imis-shell { flex-direction: column; }
    .imis-sidebar { width: 100% !important; border-right: none !important; border-bottom: 1.5px solid #0E4D2B; }
    .imis-grid-3 { grid-template-columns: 1fr !important; }
    .imis-grid-2 { grid-template-columns: 1fr !important; }
    .imis-grid-4 { grid-template-columns: 1fr 1fr !important; }
    .imis-main { padding: 18px 16px !important; }
    .imis-titleblock { flex-direction: column; }
    .imis-titleblock > div { border-right: none !important; border-bottom: 1px solid #0E4D2B; }
  }
  @media (max-width: 520px) {
    .imis-grid-4 { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
